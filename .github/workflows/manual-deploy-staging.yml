name: CD 3 - Build and deploy from main to staging

on:
  workflow_dispatch:

# OIDC: federated azure/login, no stored connection string. sqlpackage takes the
# Entra access token via /at:, so STAGING_CONNECTION_STRING is no longer needed.
permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      SQL_SERVER: ${{ vars.STAGING_SQL_SERVER }}
      SQL_DATABASE: ${{ vars.STAGING_SQL_DATABASE }}

    steps:
      - name: 'checkout code'
        uses: actions/checkout@v7

      # build the project into a dacpac file
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Acquire SQL access token
        id: token
        run: |
          TOKEN="$(az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv)"
          echo "::add-mask::$TOKEN"
          echo "sql_token=$TOKEN" >> "$GITHUB_OUTPUT"

      # deploy the sql project to staging using the Entra access token
      - name: 'Deploy dacpac'
        run: sqlpackage /a:publish /sf:'bin/Debug/ContosoOutdoors.dacpac' /tsn:"$SQL_SERVER" /tdn:"$SQL_DATABASE" /at:"${{ steps.token.outputs.sql_token }}" /p:GenerateSmartDefaults=True
        working-directory: ContosoOutdoors
