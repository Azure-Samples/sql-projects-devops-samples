name: CI - Build and deploy test for main PR

on:
  pull_request:
    branches:
      - main

jobs:
  # Generate a strong, ephemeral SA password for the throwaway SQL container so no
  # standing secret is stored. Masked in logs and passed to the test job via outputs.
  gen-password:
    runs-on: ubuntu-latest
    outputs:
      sa_password: ${{ steps.gen.outputs.sa_password }}
    steps:
      - name: Generate ephemeral SA password
        id: gen
        run: |
          PW="$(openssl rand -base64 24)Aa1!"
          echo "::add-mask::$PW"
          echo "sa_password=$PW" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: gen-password
    # Containers must run in Linux based operating systems
    runs-on: ubuntu-latest

    # service/sidecar container for sql
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 1
          SA_PASSWORD: ${{ needs.gen-password.outputs.sa_password }}
        ports:
          - 1433:1433

    env:
      SA_PASSWORD: ${{ needs.gen-password.outputs.sa_password }}

    steps:
      - name: 'checkout code'
        uses: actions/checkout@v7

      # build the project into a dacpac file
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore

      - name: 'wait for sql container to be ready'
        run: |
          set +o pipefail +e
          for i in {1..60};
          do
              sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -d master -Q "select getdate()"
              if [ $? -eq 0 ]
              then
                  echo "sql server ready"
                  break
              else
                  echo "not ready yet..."
                  sleep 1
              fi
          done
          set -o pipefail -e

      # deploy the sql project
      - name: 'Deploy dacpac'
        run: sqlpackage /a:Publish /sf:'bin/Debug/ContosoOutdoors.dacpac' /tcs:"Server=localhost;Database=ContosoOutdoors;User Id=sa;Password=$SA_PASSWORD;TrustServerCertificate=True;" /p:AllowIncompatiblePlatform=true
        working-directory: ContosoOutdoors
